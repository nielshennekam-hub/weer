<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WeerMix — Buienradar + Open-Meteo in één overzicht</title>
  <meta name="description" content="Actueel weer en buienverwachting van Buienradar gecombineerd met de 16-daagse verwachting van Open-Meteo.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛅</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">⛅</span>
      <div>
        <h1>WeerMix</h1>
        <p class="tagline">Buienradar + Open-Meteo in één overzicht</p>
      </div>
    </div>
    <div class="search">
      <input id="search-input" type="search" placeholder="Zoek een plaats…" autocomplete="off"
             aria-label="Zoek een plaats">
      <button id="geo-btn" type="button" title="Gebruik mijn locatie" aria-label="Gebruik mijn locatie">📍</button>
      <ul id="search-results" class="search-results" hidden></ul>
    </div>
  </header>

  <main id="app">
    <div id="status" class="status" hidden></div>

    <section class="grid" id="content" hidden>
      <article class="card card-current" id="card-current"></article>
      <article class="card card-rain" id="card-rain"></article>
      <article class="card card-hourly" id="card-hourly"></article>
      <article class="card card-daily" id="card-daily"></article>
      <article class="card card-report" id="card-report"></article>
    </section>
  </main>

  <footer class="footer">
    <p>
      Weergegevens: <a href="https://www.buienradar.nl" target="_blank" rel="noopener">Buienradar.nl</a>
      en <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> (CC BY 4.0).
      Verwachtingen verder dan een week vooruit zijn indicatief.
    </p>
  </footer>

  <script src="app.js" type="module"></script>
</body>
</html>
