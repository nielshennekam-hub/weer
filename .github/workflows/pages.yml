name: Publiceer naar GitHub Pages

# Publiceert de map public/ naar de gh-pages-branch; GitHub Pages serveert
# die branch. (De "GitHub Actions"-deploymethode kan Pages niet zelf
# inschakelen met het standaard workflow-token, deze branch-methode wel.)

on:
  push:
    branches: [claude/loving-curie-f2ijdg, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push public/ naar gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_INDEX_FILE="$(mktemp)"
          git read-tree "HEAD:public"
          EMPTY=$(git hash-object -w /dev/null)
          git update-index --add --cacheinfo "100644,$EMPTY,.nojekyll"
          TREE=$(git write-tree)
          unset GIT_INDEX_FILE
          COMMIT=$(git commit-tree "$TREE" -m "Pages-deploy van $GITHUB_SHA")
          git push --force origin "$COMMIT:refs/heads/gh-pages"
